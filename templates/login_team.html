{% extends 'base.html' %}
{% block title %}Team Login | MATH AUCTION{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="border: 2px solid var(--border-color); padding: 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🏆</div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: #fff;">Team Portal</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">
        Enter your team credentials to join the live auction
      </p>
    </div>

    <form method="POST" action="{{ url_for('auth.team_login') }}">
      <div class="form-group">
        <label class="form-label" for="team_code">Team Code</label>
        <input type="text" id="team_code" name="team_code" class="form-control" placeholder="e.g. TEAM001" required autofocus style="text-transform: uppercase;">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-gold" style="width: 100%; padding: 0.85rem; font-size: 1.05rem;">
          Enter Tournament Dashboard
        </button>
      </div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
      <span style="color: var(--text-muted); font-size: 0.85rem;">Are you an administrator?</span>
      <a href="{{ url_for('auth.host_login') }}" style="font-size: 0.85rem; margin-left: 0.4rem; font-weight: 600;">Host Login &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
