{% extends 'base.html' %}
{% block title %}Error {{ error_code }} | MATH AUCTION{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="font-size: 4rem; margin-bottom: 1rem; color: var(--accent-gold);">⚡</div>
    <h1 style="font-size: 2.5rem; font-weight: 900; color: #fff; margin-bottom: 0.5rem;">{{ error_code }}</h1>
    <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 1.5rem;">{{ error_message }}</h2>
    <div>
      <a href="{{ url_for('auth.index') }}" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
        Return to Home &rarr;
      </a>
    </div>
  </div>
</div>
{% endblock %}
